name: Build Android debug APK

# Builds a debug APK for sideloading (personal learning use only).
# No Play Store publishing, no credentials, no signing keys are used here.
# The APK is a debug build, not a release build.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Gradle 8.5
        run: |
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle.zip
          ./gradle-8.5/bin/gradle --version

      - name: Build debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: ./gradle-8.5/bin/gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dummy-trading-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
